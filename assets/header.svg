<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Juan Suárez, full-stack developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/><stop offset="0.55" stop-color="#101436"/><stop offset="1" stop-color="#1b0f3b"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.6" stop-color="#c7d2fe"/><stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset="0.5" stop-color="#818cf8"/><stop offset="1" stop-color="#e879f9" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="46"/></filter>
    <clipPath id="clip"><rect width="1200" height="320" rx="22"/></clipPath>
  </defs>
  <style>
    .orb1{animation:o1 11s ease-in-out infinite alternate}
    .orb2{animation:o2 13s ease-in-out infinite alternate}
    .orb3{animation:o3 9s ease-in-out infinite alternate}
    @keyframes o1{to{transform:translate(180px,40px)}}
    @keyframes o2{to{transform:translate(-220px,-30px)}}
    @keyframes o3{to{transform:translate(90px,-50px)}}
    .sweep{animation:sw 4.5s ease-in-out infinite}
    @keyframes sw{0%{transform:translateX(-1200px)}100%{transform:translateX(1200px)}}
    .cur{animation:bl 1.05s steps(1) infinite}
    @keyframes bl{50%{opacity:0}}
    .rise{animation:rs 1.2s cubic-bezier(.2,.8,.2,1) both}
    @keyframes rs{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    .d1{animation-delay:.15s}.d2{animation-delay:.4s}
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  </style>
  <g clip-path="url(#clip)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <g filter="url(#blur)">
      <circle class="orb1" cx="180" cy="90" r="120" fill="#22d3ee" fill-opacity="0.45"/>
      <circle class="orb2" cx="1020" cy="250" r="140" fill="#a855f7" fill-opacity="0.5"/>
      <circle class="orb3" cx="640" cy="40" r="90" fill="#6366f1" fill-opacity="0.4"/>
    </g>
    <text class="rise" x="600" y="158" text-anchor="middle" font-size="108" font-weight="800" letter-spacing="-4" fill="url(#name)">Juan Suárez</text>
    <text class="rise d1" x="600" y="212" text-anchor="middle" font-size="30" font-weight="500" fill="#e2e8f0" fill-opacity="0.92">Full-stack developer</text>
    <text class="rise d2 mono" x="600" y="256" text-anchor="middle" font-size="20" fill="#7dd3fc">&lt;erp /&gt;  +  custom software<tspan class="cur" fill="#e879f9"> ▍</tspan></text>
    <rect x="0" y="312" width="1200" height="8" fill="#ffffff" fill-opacity="0.04"/>
    <rect class="sweep" x="0" y="312" width="1200" height="8" fill="url(#line)"/>
  </g>
</svg>
